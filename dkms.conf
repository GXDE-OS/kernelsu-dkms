PACKAGE_NAME="kernelsu"
PACKAGE_VERSION="@PKGVER@"

BUILT_MODULE_NAME[0]="kernelsu"
DEST_MODULE_LOCATION[0]="/extra"

AUTOINSTALL="yes"

# KBUILD_MODPOST_WARN=1 is intentional: this module references kernel symbols
# that stock kernels do not export (kallsyms_lookup_name, path_mount, ...).
# modpost would fail the build on them, but the module is not meant to be
# loaded with modprobe at all — kernelsu-loader/ksuinit relocate those symbols
# against /proc/kallsyms in userspace and then call init_module. modprobe
# reporting "Unknown symbol" at load time is therefore expected, not a bug.

# Kernels built with CONFIG_WERROR=y promote upstream warnings
# (e.g. -Wmissing-declarations, -Wundef) to hard errors.
MAKE[0]="env KVERSION=${kernelver} KBUILD_MODPOST_WARN=1 KCFLAGS=-Wno-error KSU_GIT_VERSION=@KSU_GIT_VERSION@ CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y CONFIG_KSU_NON_ANDROID=y CONFIG_KSU_SELINUX=n CONFIG_KSU_DEBUG=n make KDIR=${kernel_source_dir}"
