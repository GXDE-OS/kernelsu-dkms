PACKAGE_NAME="kernelsu"
PACKAGE_VERSION="@PKGVER@"

BUILT_MODULE_NAME[0]="kernelsu"
DEST_MODULE_LOCATION[0]="/extra"

AUTOINSTALL="yes"

# KBUILD_MODPOST_WARN=1 is intentional: this module references kernel symbols
# that stock kernels do not export (kallsyms_lookup_name, path_mount, ...).
# modpost would fail the build on them, but the module is not meant to be
# loaded with modprobe at all — kernelsu-loader/ksuinit relocate those symbols
# against /proc/kallsyms in userspace and then call init_module. modprobe
# reporting "Unknown symbol" at load time is therefore expected, not a bug.
# (GXDE kernels rebuilt since 2026-11 export the full set via kernel/ksu_exports.c;
#  on those, plain modprobe works too.)

# Kernels built with CONFIG_WERROR=y promote upstream warnings
# (e.g. -Wmissing-declarations, -Wundef) to hard errors.
#
# The 6.15-era four-argument change_pid()/free_pids() code path is selected by
# LINUX_VERSION_CODE alone, so for kernels that backport it early (GXDE 6.6)
# the gate must be lowered at build time. Only 6.6.* gets the sed: stock 6.12
# trees still have the three-argument change_pid() and no free_pids(), and
# kernels >= 6.15 take the same path with the original gate.
MAKE[0]="case ${kernelver} in 6.6.*) sed -i 's/KERNEL_VERSION(6, 15, 0)/KERNEL_VERSION(6, 6, 0)/g' supercall/dispatch.c ;; esac; env KVERSION=${kernelver} KBUILD_MODPOST_WARN=1 KCFLAGS=-Wno-error KSU_GIT_VERSION=@KSU_GIT_VERSION@ CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y CONFIG_KSU_NON_ANDROID=y CONFIG_KSU_SELINUX=n CONFIG_KSU_DEBUG=n make KDIR=${kernel_source_dir}"
